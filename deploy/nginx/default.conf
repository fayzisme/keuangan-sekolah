# =====================================================================
# nginx default.conf — FASE 1 single-host:
#   * serve SPA (web/dist) di /
#   * proxy /api & /healthz ke Laravel php-fpm (app:9000)
#   * security headers + rate limit
# PRODUKSI: wajib mode HTTPS via https.conf.example (Let's Encrypt).
# =====================================================================

# Rate limit zones (nama domain per-bucket, disimpan di memori nginx)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/web;
    index index.html;
    charset utf-8;

    # ---------- Security headers (berlaku juga di https.conf.example) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------- Statis SPA (React build) ------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 30d;               # file ber-hash di nama -> cache panjang
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;   # fallback SPA routing
        add_header Cache-Control "no-cache";
    }

    # ---------- Health check (DB + Redis + queue) ---------------------
    location = /healthz {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # ---------- API (rate-limited) -------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        try_files $uri @laravel;
    }

    # Endpoint login/auth diberi ancang-ancang lebih ketat
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        try_files $uri @laravel;
    }

    location @laravel {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";      # blok header proxy user (SSRF)
        fastcgi_read_timeout 60s;
    }

    # ---------- Upload (bukti pembayaran) ------------------------------
    client_max_body_size 12m;             # sedikit di atas limit aplikasi (10MB)

    # ---------- Blokir file sensitif -----------------------------------
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|lock|md|sql|pem|key)$ { deny all; }
}